<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#891731">
<title>BAS AI Hub</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --burgundy:#891731; --burgundy-dark:#6c1226; --burgundy-soft:#f6e8eb;
  --ivory:#FCF5E6; --ivory-line:#efe3c9;
  --white:#FFFFFF; --black:#000000;
  --ink:#1c1a19; --ink-2:#55504b; --ink-3:#8a837b; --line:#e8e2d8;
  --warn:#9a5b00; --warn-bg:#fff4dc;
  --good:#1f7a4d; --good-bg:#e5f3ea;
  --radius:14px; --shadow:0 1px 2px rgba(60,20,30,.06),0 4px 16px rgba(60,20,30,.06);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--white);color:var(--ink);font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-weight:500;line-height:1.6;word-break:keep-all}
button,input{font:inherit;color:inherit}
a{color:inherit}
.hidden{display:none!important}
.logo-b svg,.wordmark svg{display:block;width:100%;height:auto}

/* 잠금 화면 */
#lock{min-height:100vh;min-height:100dvh;background:var(--ivory);display:flex;align-items:center;justify-content:center;padding:32px 16px}
.lock-card{width:100%;max-width:380px;text-align:center}
.lock-card .logo-b{width:64px;margin:0 auto 20px}
.lock-card .wordmark{width:200px;margin:0 auto 28px}
.lock-card h1{font-size:20px;font-weight:800;margin:0 0 6px}
.lock-card p{font-size:14px;color:var(--ink-2);margin:0 0 24px}
.code-input{width:100%;height:56px;border:1.5px solid var(--ivory-line);border-radius:var(--radius);background:var(--white);text-align:center;font-size:22px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;outline:none}
.code-input:focus{border-color:var(--burgundy);box-shadow:0 0 0 3px rgba(137,23,49,.12)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 20px;border:0;border-radius:var(--radius);background:var(--burgundy);color:var(--white);font-weight:700;font-size:16px;cursor:pointer;width:100%;margin-top:12px}
.btn:hover{background:var(--burgundy-dark)}
.btn:disabled{opacity:.6;cursor:default}
.lock-msg{min-height:22px;margin-top:12px;font-size:14px;color:var(--burgundy);font-weight:600}
.lock-foot{margin-top:28px;font-size:12px;color:var(--ink-3)}

/* 상단 */
header.top{position:sticky;top:0;z-index:10;background:var(--white);border-bottom:1px solid var(--line)}
.top-in{max-width:960px;margin:0 auto;height:60px;padding:0 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand .logo-b{width:24px}
.brand .wordmark{width:118px}
.top-spacer{flex:1}
.month-chip{font-size:12px;color:var(--ink-2);background:var(--ivory);border:1px solid var(--ivory-line);padding:4px 10px;border-radius:999px;white-space:nowrap}
.icon-btn{border:0;background:none;padding:8px;border-radius:10px;cursor:pointer;color:var(--ink-2);font-size:13px;font-weight:600}
.icon-btn:hover{background:var(--ivory)}

main{max-width:960px;margin:0 auto;padding:20px 16px 64px}
.crumb{font-size:13px;color:var(--ink-3);margin:0 0 10px}
.crumb a{text-decoration:none;color:var(--ink-2)}
.crumb a:hover{color:var(--burgundy)}
h2.page{font-size:24px;font-weight:800;margin:0 0 16px;letter-spacing:-.01em}

/* 검색 */
.search{position:relative;margin:0 0 20px}
.search input{width:100%;height:54px;border:1.5px solid var(--line);border-radius:var(--radius);padding:0 16px 0 48px;font-size:16px;background:var(--white);outline:none}
.search input:focus{border-color:var(--burgundy);box-shadow:0 0 0 3px rgba(137,23,49,.10)}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--ink-3)}

/* 홈 */
.hero{background:var(--ivory);border:1px solid var(--ivory-line);border-radius:20px;padding:24px 20px;margin:0 0 24px}
.hero h2{font-size:22px;font-weight:800;margin:0 0 4px}
.hero p{margin:0 0 16px;color:var(--ink-2);font-size:14px}
.hero .search{margin:0}
.cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.cat-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:860px){.cat-grid{grid-template-columns:repeat(4,1fr)}}
.cat{display:flex;flex-direction:column;gap:10px;padding:18px 16px;border:1px solid var(--line);border-radius:var(--radius);background:var(--white);text-decoration:none;box-shadow:var(--shadow);min-height:124px;transition:border-color .15s,transform .15s}
.cat:hover{border-color:var(--burgundy);transform:translateY(-1px)}
.cat-ic{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--burgundy);color:var(--white)}
.cat.soon .cat-ic{background:var(--ivory);color:var(--burgundy);border:1px solid var(--ivory-line)}
.cat-ic svg{width:20px;height:20px}
.cat-name{font-weight:800;font-size:16px;line-height:1.35}
.cat-sub{font-size:12px;color:var(--ink-3);margin-top:-6px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--ivory);color:var(--ink-2);border:1px solid var(--ivory-line);align-self:flex-start}
.badge.on{background:var(--burgundy-soft);color:var(--burgundy);border-color:transparent}

/* 칩 */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;margin:0 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--white);font-size:14px;font-weight:600;color:var(--ink-2);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--burgundy);border-color:var(--burgundy);color:var(--white)}

/* 레시피 목록 */
.list{display:grid;gap:10px}
@media(min-width:720px){.list{grid-template-columns:1fr 1fr}}
.item{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--radius);text-decoration:none;background:var(--white)}
.item:hover{border-color:var(--burgundy)}
.item-main{flex:1;min-width:0}
.item-name{font-weight:700;font-size:16px}
.item-meta{font-size:12px;color:var(--ink-3)}
.item .arrow{color:var(--ink-3)}
.group-title{font-size:13px;font-weight:800;color:var(--burgundy);margin:20px 0 8px;letter-spacing:.02em}
.empty{padding:32px 16px;text-align:center;color:var(--ink-3);border:1px dashed var(--line);border-radius:var(--radius)}

/* 레시피 상세 */
.r-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 4px}
.r-head h2{margin:0}
.r-base{font-size:14px;color:var(--ink-2);margin:0 0 18px}
.card{border:1px solid var(--line);border-radius:var(--radius);background:var(--white);padding:18px 16px;margin:0 0 14px}
.card h3{font-size:16px;font-weight:800;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.card h3::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--burgundy)}
.tbl-wrap{overflow-x:auto;margin:0 -4px}
table.qty{width:100%;border-collapse:collapse;font-size:15px}
table.qty th,table.qty td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
table.qty th:first-child,table.qty td:first-child{text-align:left;white-space:normal}
table.qty thead th{font-size:13px;color:var(--ink-2);font-weight:700;background:var(--ivory);cursor:pointer;user-select:none}
table.qty thead th:first-child{cursor:default}
table.qty th.act,table.qty td.act{background:var(--burgundy-soft);color:var(--burgundy);font-weight:800}
table.qty thead th.act{background:var(--burgundy);color:var(--white)}
table.qty tr:last-child td{border-bottom:0}
.ing-note{display:block;font-size:12px;color:var(--ink-3);font-weight:500}
.scale-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 12px;font-size:13px;color:var(--ink-2)}
.scale-row input{width:84px;height:36px;border:1px solid var(--line);border-radius:10px;padding:0 10px;text-align:right}
.hint{font-size:12px;color:var(--ink-3);margin:8px 0 0}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:0 0 12px 38px;min-height:28px}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;background:var(--burgundy);color:var(--white);font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}
ol.steps li:last-child{padding-bottom:0}
.sg{font-size:14px;font-weight:800;color:var(--burgundy);background:var(--ivory);border:1px solid var(--ivory-line);border-radius:8px;padding:6px 10px;margin:16px 0 10px}
.amt{font-weight:800;color:var(--burgundy);background:var(--burgundy-soft);padding:0 4px;border-radius:4px}
ul.notes{margin:0;padding-left:18px}
ul.notes li{margin:0 0 6px}
.src{font-size:12px;color:var(--ink-3);margin:6px 0 0}
.verify{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600;margin:0 0 14px}
.muted{color:var(--ink-3);font-size:14px;margin:0}
.asm{display:grid;gap:12px}
@media(min-width:640px){.asm{grid-template-columns:1fr 1fr}}
.asm-box{border-radius:12px;padding:14px;background:var(--ivory);border:1px solid var(--ivory-line)}
.asm-box h4{margin:0 0 8px;font-size:14px;font-weight:800;color:var(--burgundy)}
.asm-box ol{margin:0;padding-left:20px}
.fry{display:flex;flex-wrap:wrap;gap:8px}
.fry span{background:var(--ivory);border:1px solid var(--ivory-line);border-radius:10px;padding:8px 12px;font-size:14px}
.fry b{color:var(--burgundy)}

/* 준비중 */
.soon-box{text-align:center;padding:56px 16px;background:var(--ivory);border:1px solid var(--ivory-line);border-radius:20px}
.soon-box .logo-b{width:44px;margin:0 auto 16px}
.soon-box h3{font-size:20px;font-weight:800;margin:0 0 6px}
.soon-box p{color:var(--ink-2);margin:0}

/* 매장 랭킹 */
.rk-sub{font-size:14px;color:var(--ink-2);margin:-8px 0 16px}
.my-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--ivory);border:1px solid var(--ivory-line);border-radius:var(--radius);padding:12px 14px;margin:0 0 16px;font-size:14px;font-weight:700}
.my-row select{height:38px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--white);font:inherit;font-weight:600;min-width:140px}
.my-sum{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:0 0 18px}
@media(min-width:640px){.my-sum{grid-template-columns:repeat(4,1fr)}}
.my-sum div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--white)}
.my-sum span{display:block;font-size:12px;color:var(--ink-3)}
.my-sum b{font-size:18px;font-weight:800;color:var(--burgundy)}
.my-sum small{font-size:12px;color:var(--ink-2);font-weight:600;margin-left:4px}
.clap{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:0 0 20px}
@media(min-width:720px){.clap{grid-template-columns:repeat(4,1fr)}}
.clap div{background:var(--burgundy);color:var(--white);border-radius:var(--radius);padding:14px}
.clap span{display:block;font-size:12px;opacity:.8}
.clap b{display:block;font-size:17px;font-weight:800;line-height:1.35;margin-top:2px}
.rk-list{display:grid;gap:8px}
.rk{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--white)}
.rk.me{border-color:var(--burgundy);background:var(--burgundy-soft)}
.rk-n{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;background:var(--ivory);border:1px solid var(--ivory-line);color:var(--ink-2)}
.rk-n.top{background:var(--burgundy);border-color:var(--burgundy);color:var(--white)}
.rk-name{font-weight:800;font-size:15px}
.rk-tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;margin-left:6px;vertical-align:2px;background:var(--ivory);border:1px solid var(--ivory-line);color:var(--ink-2)}
.rk-tag.me{background:var(--burgundy);border-color:var(--burgundy);color:var(--white)}
.rk-tag.good{background:var(--good-bg);border-color:transparent;color:var(--good)}
.rk-bar{height:6px;border-radius:3px;background:var(--ivory);margin-top:6px;overflow:hidden}
.rk-bar i{display:block;height:100%;background:var(--burgundy);border-radius:3px}
.rk-meta{font-size:12px;color:var(--ink-3);margin-top:2px}
.rk-v{text-align:right;font-weight:800;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.rk-v.neg{color:var(--ink-3)}
.rk-ch{display:block;font-size:12px;font-weight:700;color:var(--ink-3)}
.rk-ch.up{color:var(--good)}
.rk-note{font-size:12px;color:var(--ink-3);margin:10px 0 0}
.quotes{display:grid;gap:10px;margin-top:8px}
@media(min-width:720px){.quotes{grid-template-columns:repeat(3,1fr)}}
.quote{background:var(--ivory);border:1px solid var(--ivory-line);border-radius:var(--radius);padding:14px;font-size:14px}
.quote p{margin:0 0 8px}
.quote span{font-size:12px;color:var(--ink-2);font-weight:700}
.strong{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(min-width:720px){.strong{grid-template-columns:repeat(4,1fr)}}
.strong div{border:1px solid var(--line);border-radius:12px;padding:12px}
.strong div.me{border-color:var(--burgundy);background:var(--burgundy-soft)}
.strong span{display:block;font-size:12px;color:var(--ink-3);font-weight:700}
.strong b{display:block;font-size:15px;font-weight:800;color:var(--burgundy)}
.strong small{font-size:12px;color:var(--ink-2)}

/* 뉴스 */
.nw-head{background:var(--ivory);border:1px solid var(--ivory-line);border-radius:var(--radius);padding:16px;margin:0 0 16px}
.nw-head h3{margin:0 0 8px;font-size:15px;font-weight:800;color:var(--burgundy)}
.nw-head ol{margin:0;padding-left:20px}
.nw-head li{margin:0 0 6px}
.nw-list{display:grid;gap:12px}
@media(min-width:720px){.nw-list{grid-template-columns:1fr 1fr}}
.nw{border:1px solid var(--line);border-radius:var(--radius);padding:16px;background:var(--white);display:flex;flex-direction:column}
.nw-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12px;color:var(--ink-3);margin:0 0 8px}
.nw h3{font-size:16px;font-weight:800;margin:0 0 8px;line-height:1.4}
.nw .notes{font-size:14px;margin:0 0 10px}
.nw-imp{background:var(--burgundy-soft);border-radius:10px;padding:10px 12px;font-size:14px;margin:0 0 10px}
.nw-imp b{display:block;font-size:12px;color:var(--burgundy);margin-bottom:2px}
.nw-link{margin-top:auto;font-size:13px;font-weight:700;color:var(--burgundy);text-decoration:none;align-self:flex-start}

footer.foot{max-width:960px;margin:0 auto;padding:20px 16px 40px;color:var(--ink-3);font-size:12px;border-top:1px solid var(--line)}
</style>
</head>

<script>
(function(){
"use strict";
var STORE_KEY="bas-info-code";
var P=JSON.parse(document.getElementById("payload").textContent);
var DATA=null;

function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function norm(c){return (c||"").toUpperCase().replace(/[^0-9A-Z가-힣]/g,"")}
function lsGet(){try{return localStorage.getItem(STORE_KEY)}catch(e){return null}}
function lsSet(v){try{localStorage.setItem(STORE_KEY,v)}catch(e){}}
function lsDel(){try{localStorage.removeItem(STORE_KEY)}catch(e){}}

async function decrypt(code){
  var enc=new TextEncoder();
  var base=await crypto.subtle.importKey("raw",enc.encode(norm(code)),"PBKDF2",false,["deriveKey"]);
  var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.salt),iterations:P.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.iv)},key,b64(P.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

var form=document.getElementById("lock-form"),input=document.getElementById("code"),msg=document.getElementById("lock-msg"),btn=document.getElementById("enter");
form.addEventListener("submit",async function(e){
  e.preventDefault();
  var c=input.value;
  if(!norm(c)){msg.textContent="입장코드를 입력해 주세요.";return}
  btn.disabled=true;btn.textContent="확인 중…";msg.textContent="";
  try{DATA=await decrypt(c);lsSet(norm(c));open()}
  catch(err){msg.textContent="입장코드가 맞지 않습니다. 이번 달 코드인지 확인해 주세요.";input.select()}
  btn.disabled=false;btn.textContent="입장하기";
});
document.getElementById("logout").addEventListener("click",function(){lsDel();location.hash="";location.reload()});

(async function(){
  if(!window.crypto||!crypto.subtle){msg.textContent="이 브라우저에서는 열 수 없습니다. 크롬이나 사파리 최신 버전으로 열어 주세요.";btn.disabled=true;return}
  var saved=lsGet();
  if(saved){try{DATA=await decrypt(saved);open();return}catch(e){lsDel()}}
  input.focus();
})();

function open(){
  var nc=cat("news");if(nc&&DATA.news&&DATA.news.weeks.length){nc.ready=true;nc.badge=DATA.news.weeks[0].title+" 브리핑"}
  var rc=cat("rank");if(rc&&DATA.ranking){rc.ready=true;rc.badge=DATA.ranking.period.split(" (")[0]}
  document.getElementById("lock").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  window.addEventListener("hashchange",route);
  route();
}

/* ---------- 유틸 ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]})}
var CHO="ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
function initials(s){var o="";for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);o+=(c>=0xAC00&&c<=0xD7A3)?CHO[Math.floor((c-0xAC00)/588)]:s[i]}return o}
function key(s){return String(s).toLowerCase().replace(/[\s·()\-_/]/g,"")}
function isCho(s){return /^[ㄱ-ㅎ]+$/.test(s)}
function matches(r,q){
  q=key(q);if(!q)return true;
  var words=[r.name].concat(r.aliases||[]);
  for(var i=0;i<words.length;i++){var w=key(words[i]);if(w.indexOf(q)>=0)return true;if(isCho(q)&&initials(w).indexOf(q)>=0)return true}
  if(!isCho(q)&&(r.ingredients||[]).some(function(g){return key(g.name).indexOf(q)>=0}))return true;
  return false;
}
function fmtNum(v){var r=Math.round(v*100)/100;return r.toLocaleString("ko-KR",{maximumFractionDigits:2})}
function fmtQty(g,m){
  if(g.qty==null)return g.note&&!g.unit?"":"적당량";
  var v=g.qty*m,u=g.unit;
  if(u==="kg"&&v<1){v=v*1000;u="g"}
  return fmtNum(v)+u;
}
function fmtMul(m){return fmtNum(m)+"배수"}

/* ---------- 라우터 ---------- */
function route(){
  var h=decodeURIComponent(location.hash.replace(/^#\/?/,""));
  var parts=h.split("/");
  window.scrollTo(0,0);
  if(!h)return home();
  if(parts[0]==="c"){if(parts[1]==="recipe")return recipeList(parts[2]||"");if(parts[1]==="rank"&&DATA.ranking)return rankView();if(parts[1]==="news"&&DATA.news)return newsView();return soon(parts[1])}
  if(parts[0]==="r")return recipeView(parts[1]);
  home();
}

function home(){
  var R=DATA.recipes;
  V().innerHTML='<section class="hero"><h2>무엇을 찾으세요?</h2><p>메뉴 이름이나 재료로 검색하세요. 예: 코울슬로, 타타르, ㅋㅇㅅㄹ</p>'+searchBox("q","","레시피 검색")+'</section>'+

/* ---------- 매장 랭킹 ---------- */
var MY_KEY="bas-my-store",rkTab="growth";
function myGet(){try{return localStorage.getItem(MY_KEY)||""}catch(e){return ""}}
function mySet(v){try{if(v)localStorage.setItem(MY_KEY,v);else localStorage.removeItem(MY_KEY)}catch(e){}}
function ranked(arr,val,desc){
  var a=arr.map(function(x){var y={};for(var k in x)y[k]=x[k];return y});
  a.sort(function(x,y){return desc?val(y)-val(x):val(x)-val(y)});
  a.forEach(function(x,i){x._r=(i>0&&val(a[i-1])===val(x))?a[i-1]._r:i+1});
  return a;
}
function sgn(v){return (v>0?"+":"")+fmtNum(v)}
function rankView(){
  var K=DATA.ranking,my=myGet(),cons=K.consign||[];
  var stores=K.growth.map(function(x){return x.store});
  if(stores.indexOf(my)<0)my="";
  var cTot=function(x){return x.hall+x.delivery};
  var G=ranked(K.growth,function(x){return x.rate},true),
      P=ranked(K.praise,function(x){return x.rate!=null?x.rate:x.count},true),
      C=ranked(K.complaints,function(x){return x.rate!=null?x.rate:cTot(x)},false),
      M=ranked(K.mistakes,function(x){return x.count},false);
  function find(a,s){return a.filter(function(x){return x.store===s})[0]}
  function firsts(a){return a.filter(function(x){return x._r===1}).map(function(x){return x.store}).join(", ")}
  var TABS=[["growth","매출 상승률"],["praise","칭찬 리뷰"],["complaints","컴플레인"],["mistakes","주간업무 실수"],["menus","잘 팔리는 메뉴"]];
  var zeroC=C.filter(function(x){return cTot(x)===0}).map(function(x){return x.store}),
      zeroM=M.filter(function(x){return x.count===0}).map(function(x){return x.store});

  var h=crumb([["홈","#/"],["매장 랭킹"]])+'<h2 class="page">매장 랭킹</h2><p class="rk-sub">'+esc(K.period)+' · '+esc(K.compare)+'와 비교</p>'+
    (K.sample?'<div class="verify">시안입니다. 아래 숫자는 모두 가짜입니다.</div>':'')+
    '<div class="my-row"><label for="my">우리 매장</label><select id="my"><option value="">선택 안 함</option>'+stores.map(function(s){return '<option'+(s===my?' selected':'')+'>'+esc(s)+'</option>'}).join("")+'</select></div>';
  if(my){
    var g=find(G,my),p=find(P,my),c=find(C,my),m=find(M,my);
    h+='<div class="my-sum">'+
      '<div><span>매출 상승률</span><b>'+g._r+'위</b><small>'+sgn(g.rate)+'%</small></div>'+
      '<div><span>칭찬 비율</span><b>'+p._r+'위</b><small>'+(p.rate!=null?fmtNum(p.rate)+'%':p.count+'건')+'</small></div>'+
      '<div><span>컴플레인 비율</span><b>'+(c.rate!=null?fmtNum(c.rate)+'%':cTot(c)+'건')+'</b><small>낮은 순 '+c._r+'위</small></div>'+
      '<div><span>주간업무 실수</span><b>'+m.count+'건</b><small>적은 순 '+m._r+'위</small></div></div>';
  }
  h+='<div class="clap">'+
    '<div><span>매출 상승률 1위</span><b>'+esc(firsts(G))+'</b></div>'+
    '<div><span>칭찬 비율 1위</span><b>'+esc(firsts(P))+'</b></div>'+
    (zeroC.length?'<div><span>컴플레인 0건</span><b>'+esc(zeroC.join(", "))+'</b></div>':'<div><span>컴플레인 비율 가장 낮은 매장 ('+(C[0].rate!=null?fmtNum(C[0].rate)+'%':cTot(C[0])+'건')+')</span><b>'+esc(firsts(C))+'</b></div>')+
    (zeroM.length?'<div><span>주간업무 완벽 수행</span><b>'+esc(zeroM.join(", "))+'</b></div>':'<div><span>주간업무 실수 가장 적은 매장 ('+M[0].count+'건)</span><b>'+esc(firsts(M))+'</b></div>')+'</div>';
  h+='<div class="chips" role="group" aria-label="지표">'+TABS.map(function(t){return '<button class="chip" type="button" data-t="'+t[0]+'" aria-pressed="'+(t[0]===rkTab)+'">'+t[1]+'</button>'}).join("")+'</div><div id="rk"></div>';
  V().innerHTML=h;

  function name(s){return '<span class="rk-name">'+esc(s)+'</span>'+(cons.indexOf(s)>=0?'<span class="rk-tag">위탁</span>':'')+(s===my?'<span class="rk-tag me">우리 매장</span>':'')}
  function row(x,mid,val,valCls,ch){
    return '<div class="rk'+(x.store===my?' me':'')+'"><span class="rk-n'+(x._r<=3?' top':'')+'">'+x._r+'</span><div>'+name(x.store)+mid+'</div><div class="rk-v'+(valCls?' '+valCls:'')+'">'+val+(ch||'')+'</div></div>';
  }
  function less(now,prev){
    var d=now-prev;
    if(d<0)return '<span class="rk-ch up">▼'+(-d)+'건 줄었어요</span>';
    return '<span class="rk-ch">지난주 '+prev+'건</span>';
  }
  function draw(){
    var o="";
    if(rkTab==="growth"){
      var mx=Math.max.apply(null,G.map(function(x){return x.rate}));
      o='<div class="rk-list">'+G.map(function(x){
        return row(x,(x.note?'<div class="rk-meta">'+esc(x.note)+'</div>':'')+'<div class="rk-bar"><i style="width:'+(x.rate>0&&mx>0?Math.round(x.rate/mx*100):0)+'%"></i></div>',sgn(x.rate)+'%',x.rate<0?'neg':'');
      }).join("")+'</div><p class="rk-note">'+esc(K.compare)+'와 비교한 매출 상승률입니다. 매출 금액은 공개하지 않습니다.</p>';
    }else if(rkTab==="praise"){
      o='<div class="rk-list">'+P.map(function(x){
        var r=x.rate!=null?x.rate:0,d=x.prevRate!=null?Math.round((r-x.prevRate)*10)/10:null;
        return row(x,'<div class="rk-meta">칭찬 '+x.count+'건 / 리뷰 '+x.reviews+'건 · 5점 비율 '+x.fiveRate+'%'+(x.note?' · '+esc(x.note):'')+(x.reviews<20?' <span class="rk-tag">리뷰 적음</span>':'')+'</div><div class="rk-bar"><i style="width:'+Math.round(r)+'%"></i></div>',fmtNum(r)+'%','',d!=null&&d>0?'<span class="rk-ch up">▲'+fmtNum(d)+'%p 올랐어요</span>':'<span class="rk-ch">지난주 '+(x.prevRate!=null?fmtNum(x.prevRate)+'%':'-')+'</span>');
      }).join("")+'</div>';
      if(K.quotes&&K.quotes.length)o+='<p class="group-title">이번 주 칭찬 리뷰</p><div class="quotes">'+K.quotes.map(function(q){return '<div class="quote"><p>“'+esc(q.text)+'”</p><span>'+esc(q.store)+' · '+esc(q.where)+'</span></div>'}).join("")+'</div>';
    }else if(rkTab==="complaints"){
      o='<div class="rk-list">'+C.map(function(x){
        var t=cTot(x),r=x.rate!=null?x.rate:0,d=x.prevRate!=null?Math.round((r-x.prevRate)*10)/10:null;
        return row(x,'<div class="rk-meta">홀 '+x.hall+'건 · 배달 '+x.delivery+'건 / 리뷰 '+x.reviews+'건'+(x.note?' · '+esc(x.note):'')+(t===0?' <span class="rk-tag good">0건 달성</span>':'')+(x.reviews<20?' <span class="rk-tag">리뷰 적음</span>':'')+'</div>',fmtNum(r)+'%','',d!=null&&d<0?'<span class="rk-ch up">▼'+fmtNum(-d)+'%p 줄었어요</span>':'<span class="rk-ch">지난주 '+(x.prevRate!=null?fmtNum(x.prevRate)+'%':'-')+'</span>');
      }).join("")+'</div><p class="rk-note">컴플레인이 적은 매장부터 보여 줍니다.</p>';
    }else if(rkTab==="mistakes"){
      o='<div class="rk-list">'+M.map(function(x){
        return row(x,x.count===0?'<div class="rk-meta"><span class="rk-tag good" style="margin-left:0">완벽 수행</span></div>':'',x.count+'건','',less(x.count,x.prev));
      }).join("")+'</div><p class="rk-note">주간업무 점검에서 나온 실수 건수입니다. 적은 매장부터 보여 줍니다.</p>';
    }else{
      var T=K.menus.top,ms=T[0].share;
      o='<p class="group-title" style="margin-top:4px">전 매장 인기 메뉴 TOP '+T.length+'</p><div class="rk-list">'+T.map(function(x,i){
        return '<div class="rk"><span class="rk-n'+(i<3?' top':'')+'">'+(i+1)+'</span><div><span class="rk-name">'+esc(x.name)+'</span><div class="rk-bar"><i style="width:'+Math.round(x.share/ms*100)+'%"></i></div></div><div class="rk-v">'+fmtNum(x.share)+'%</div></div>';
      }).join("")+'</div><p class="rk-note">전체 주문 중 차지한 비율입니다.</p>'+
      '<p class="group-title">우리 매장 강세 메뉴</p><div class="strong">'+K.menus.strong.map(function(x){
        return '<div'+(x.store===my?' class="me"':'')+'><span>'+esc(x.store)+'</span><b>'+esc(x.menu)+'</b><small>'+esc(x.note)+'</small></div>';
      }).join("")+'</div><p class="rk-note">다른 매장보다 우리 매장에서 유독 잘 팔리는 메뉴입니다.</p>';
    }
    if(K.sources&&K.sources[rkTab])o=o.replace(/<p class="rk-note">[^<]*<\/p>/,"")+'<p class="rk-note">'+esc(K.sources[rkTab])+'</p>';
    document.getElementById("rk").innerHTML=o;
  }
  Array.prototype.forEach.call(document.querySelectorAll(".chip"),function(b){b.addEventListener("click",function(){rkTab=b.dataset.t;Array.prototype.forEach.call(document.querySelectorAll(".chip"),function(x){x.setAttribute("aria-pressed",x===b)});draw()})});

  if(cats.indexOf(nwCat)<0)nwCat="전체";
  h+='<div class="chips" role="group" aria-label="분야">'+cats.map(function(c){return '<button class="chip" type="button" data-c="'+esc(c)+'" aria-pressed="'+(c===nwCat)+'">'+esc(c)+'</button>'}).join("")+'</div><div id="nl"></div>'+
    '<p class="rk-note">기사 원문은 각 언론사에 있습니다. 이 페이지는 요약과 링크만 담습니다.</p>';
  V().innerHTML=h;
  function draw(){
    var its=w.items.filter(function(x){return nwCat==="전체"||x.cat===nwCat});
    document.getElementById("nl").innerHTML='<div class="nw-list">'+its.map(function(x){
      return '<article class="nw"><div class="nw-meta"><span class="rk-tag" style="margin-left:0">'+esc(x.cat)+'</span><span>'+esc(x.source)+' · '+esc(x.date)+'</span></div>'+
        '<h3>'+esc(x.title)+'</h3><ul class="notes">'+x.summary.map(function(s){return '<li>'+esc(s)+'</li>'}).join("")+'</ul>'+
        '<div class="nw-imp"><b>우리 매장에는</b>'+esc(x.impact)+'</div>'+
        '<a class="nw-link" href="'+esc(x.url)+'" target="_blank" rel="noopener noreferrer">원문 보기 ›</a></article>';
    }).join("")+'</div>';
  }
  Array.prototype.forEach.call(document.querySelectorAll(".chip"),function(b){b.addEventListener("click",function(){nwCat=b.dataset.c;Array.prototype.forEach.call(document.querySelectorAll(".chip"),function(x){x.setAttribute("aria-pressed",x===b)});draw()})});
  var sel=document.getElementById("nw");if(sel)sel.addEventListener("change",function(){nwWeek=+sel.value;newsView()});
  draw();
}

function soon(id){
  var c=cat(id);
  if(!c)return home();
  V().innerHTML=crumb([["홈","#/"],[c.name]])+'<h2 class="page">'+esc(c.name)+(c.sub?' <span style="font-size:15px;color:var(--ink-3);font-weight:600">'+esc(c.sub)+'</span>':'')+'</h2>'+
    '<div class="soon-box"><div class="logo-b" aria-hidden="true">'+document.querySelector(".brand .logo-b").innerHTML+'</div><h3>준비중입니다</h3><p>'+esc(c.name)+' 정보는 곧 올라옵니다.<br>지금은 레시피를 먼저 이용해 주세요.</p><a class="btn" style="max-width:220px;margin-top:20px;text-decoration:none" href="#/c/recipe">레시피 보러 가기</a></div>';
}
})();
</script>
